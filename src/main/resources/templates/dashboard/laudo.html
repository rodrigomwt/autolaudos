<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/layout_dash}">

<head>
  <title>Laudo Veicular</title>

  <!-- ── CSS específico do laudo ── -->
  <th:block layout:fragment="css">
    <style>
/* ================================================================
     LAUDO VEICULAR — Estilos
     Prefixo: .laudo-  (sem conflito com Bootstrap / outras libs)
  ================================================================ */

  :root {
    --lau-primary: #1b3a6b;
    --lau-primary-light: #2d5ba3;
    --lau-accent: #1e88e5;
    --lau-success: #2e7d32;
    --lau-success-bg: #e8f5e9;
    --lau-warning: #e65100;
    --lau-warning-bg: #fff3e0;
    --lau-danger: #c62828;
    --lau-danger-bg: #ffebee;
    --lau-muted: #546e7a;
    --lau-border: #cfd8dc;
    --lau-bg: #eceff1;
    --lau-card-bg: #ffffff;
    --lau-header-bg: #1b3a6b;
    --lau-header-text: #ffffff;
    --lau-text: #212121;
    --lau-text-secondary: #546e7a;
    --lau-radius: 6px;
    --lau-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }

  #laudo-root {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 14px;
    color: var(--lau-text);
    line-height: 1.5;
    background: var(--lau-bg);
    padding: 16px;
    box-sizing: border-box;
  }

  /* ── SEÇÕES ── */
  .laudo-section {
    background: var(--lau-card-bg);
    border-radius: var(--lau-radius);
    box-shadow: var(--lau-shadow);
    margin-bottom: 16px;
    overflow: hidden;
  }

  .laudo-section-header {
    background: var(--lau-header-bg);
    color: var(--lau-header-text);
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .4px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }

  .laudo-section-header .lau-toggle {
    margin-left: auto;
    font-size: 16px;
    transition: transform .2s;
  }

  .laudo-section-header.collapsed .lau-toggle { transform: rotate(-90deg); }

  .laudo-section-body {
    padding: 14px 16px;
  }

  .laudo-section-body.hidden { display: none; }

  /* ── CABEÇALHO DO LAUDO ── */
  .laudo-header-card {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: flex-start;
    padding: 18px;
    background: #fff;
    border-radius: var(--lau-radius);
    box-shadow: var(--lau-shadow);
    margin-bottom: 16px;
  }

  .laudo-logo-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 110px;
  }

  .laudo-logo-placeholder {
    width: 100px;
    height: 70px;
    border: 2px dashed var(--lau-border);
    border-radius: var(--lau-radius);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f7fa;
    overflow: hidden;
  }

  .laudo-logo-placeholder img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: none;
  }

  .laudo-logo-placeholder img.loaded { display: block; }

  .laudo-logo-text {
    font-size: 11px;
    font-weight: 700;
    color: var(--lau-primary);
    text-align: center;
    letter-spacing: 1px;
    padding: 2px;
  }

  .laudo-tipo-badge {
    margin-top: 6px;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: #fff;
  }

  .badge-essencial { background: #546e7a; }
  .badge-completa  { background: #1565c0; }
  .badge-premium   { background: #6a1b9a; }

  .laudo-header-info {
    flex: 1;
    min-width: 260px;
  }

  .laudo-header-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--lau-primary);
    margin: 0 0 4px;
    line-height: 1.2;
  }

  .laudo-header-subtitle {
    font-size: 13px;
    color: var(--lau-text-secondary);
    margin-bottom: 10px;
  }

  .laudo-infogrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 6px 14px;
  }

  .laudo-infoitem {
    display: flex;
    flex-direction: column;
  }

  .laudo-infoitem-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--lau-text-secondary);
    text-transform: uppercase;
    letter-spacing: .4px;
  }

  .laudo-infoitem-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--lau-text);
  }

  /* ── RISCO ── */
  .laudo-risco-wrapper {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .laudo-risco-gauge {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 120px;
  }

  .laudo-risco-circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 6px;
  }

  .laudo-risco-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  .risco-1,.risco-2,.risco-3 { background: var(--lau-success); }
  .risco-4,.risco-5          { background: #f9a825; }
  .risco-6,.risco-7          { background: var(--lau-warning); }
  .risco-8,.risco-9,.risco-10{ background: var(--lau-danger); }

  .risco-text-baixo   { color: var(--lau-success); }
  .risco-text-medio   { color: #f9a825; }
  .risco-text-alto    { color: var(--lau-warning); }
  .risco-text-critico { color: var(--lau-danger); }

  .laudo-risco-parecer {
    flex: 1;
    font-size: 14px;
    font-style: italic;
    color: var(--lau-text-secondary);
    line-height: 1.6;
    border-left: 3px solid var(--lau-border);
    padding-left: 12px;
  }

  /* Barra de segmentos de risco */
  .laudo-risco-bar {
    display: flex;
    gap: 4px;
    margin-top: 10px;
    margin-bottom: 4px;
    width: 100%;
  }
  .laudo-risco-seg {
    flex: 1;
    height: 14px;
    border-radius: 3px;
    opacity: 0.2;
    transition: opacity .2s;
  }
  .laudo-risco-seg.active { opacity: 1; }
  .seg-baixo   { background: var(--lau-success); }
  .seg-medio   { background: #f9a825; }
  .seg-alto    { background: var(--lau-warning); }
  .seg-critico { background: var(--lau-danger); }

  /* ── BADGES DE STATUS ── */
  .lau-status {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .lau-ok      { background: var(--lau-success-bg); color: var(--lau-success); }
  .lau-warn    { background: var(--lau-warning-bg); color: var(--lau-warning); }
  .lau-danger  { background: var(--lau-danger-bg);  color: var(--lau-danger); }
  .lau-neutral { background: #eceff1; color: #546e7a; }

  /* ── TABELAS ── */
  .laudo-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .laudo-table th {
    background: #f0f4f8;
    color: var(--lau-primary);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    padding: 8px 10px;
    text-align: left;
    border-bottom: 2px solid var(--lau-border);
  }

  .laudo-table td {
    padding: 7px 10px;
    border-bottom: 1px solid #eceff1;
    vertical-align: top;
    color: var(--lau-text);
  }

  .laudo-table tbody tr:hover { background: #f5f7fa; }

  .laudo-table .lau-td-label {
    font-weight: 600;
    color: var(--lau-text-secondary);
    white-space: nowrap;
    width: 200px;
  }

  /* ── KV GRID (chave/valor) ── */
  .laudo-kv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px 20px;
  }

  .laudo-kv-item { display: flex; flex-direction: column; }

  .laudo-kv-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--lau-text-secondary);
    margin-bottom: 2px;
  }

  .laudo-kv-value {
    font-size: 13px;
    color: var(--lau-text);
    font-weight: 500;
  }

  /* ── RESTRICÕES ── */
  .laudo-restricoes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }

  .laudo-restricao-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 8px 10px;
    border-radius: 4px;
    border: 1px solid var(--lau-border);
    background: #fafafa;
  }

  .laudo-restricao-item .laudo-kv-label { margin-bottom: 0; }

  /* ── LEILÃO SCORE ── */
  .laudo-score-bars {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 12px;
  }

  .laudo-score-item {
    flex: 1;
    min-width: 130px;
    background: #f5f7fa;
    border-radius: 4px;
    padding: 10px 12px;
    border: 1px solid var(--lau-border);
  }

  .laudo-score-item-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--lau-text-secondary);
    margin-bottom: 4px;
  }

  .laudo-score-bar-wrap {
    background: #dde;
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .laudo-score-bar-fill {
    height: 8px;
    border-radius: 6px;
    background: var(--lau-accent);
    transition: width .4s;
  }

  .laudo-score-value {
    font-size: 13px;
    font-weight: 700;
    color: var(--lau-primary);
  }

  /* ── FIPE HISTÓRICO ── */
  .laudo-fipe-valor {
    font-size: 28px;
    font-weight: 800;
    color: var(--lau-primary);
    margin-bottom: 4px;
  }

  .laudo-historico-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }

  .laudo-historico-item {
    background: #f0f4f8;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 11px;
    color: var(--lau-text-secondary);
  }

  /* ── PROPRIETÁRIOS ── */
  .laudo-prop-timeline {
    position: relative;
    padding-left: 24px;
  }

  .laudo-prop-timeline::before {
    content: '';
    position: absolute;
    left: 7px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--lau-border);
  }

  .laudo-prop-item {
    position: relative;
    margin-bottom: 14px;
    padding: 10px 12px;
    background: #f5f7fa;
    border-radius: 4px;
    border: 1px solid var(--lau-border);
  }

  .laudo-prop-item::before {
    content: '';
    position: absolute;
    left: -22px;
    top: 14px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--lau-primary);
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--lau-border);
  }

  .laudo-prop-nome {
    font-weight: 700;
    color: var(--lau-primary);
    font-size: 14px;
  }

  .laudo-prop-meta {
    font-size: 12px;
    color: var(--lau-text-secondary);
    margin-top: 2px;
  }

  /* ── FICHA TÉCNICA ── */
  .laudo-ficha-group {
    margin-bottom: 16px;
  }

  .laudo-ficha-group-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--lau-primary);
    border-bottom: 2px solid var(--lau-border);
    padding-bottom: 4px;
    margin-bottom: 8px;
    letter-spacing: .4px;
  }

  /* ── RADAR SECURITÁRIO ── */
  .laudo-radar-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }

  .laudo-radar-card {
    background: #f5f7fa;
    border: 1px solid var(--lau-border);
    border-radius: var(--lau-radius);
    padding: 10px 12px;
  }

  .laudo-radar-card-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--lau-text-secondary);
    margin-bottom: 6px;
    letter-spacing: .4px;
  }

  .laudo-radar-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 3px;
  }

  .laudo-radar-key { color: var(--lau-text-secondary); }
  .laudo-radar-val { font-weight: 600; color: var(--lau-text); }

  /* ── CUSTO MÉDIO ── */
  .laudo-custo-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }

  .laudo-custo-card {
    flex: 1;
    min-width: 120px;
    background: #f0f4f8;
    border-radius: var(--lau-radius);
    border: 1px solid var(--lau-border);
    padding: 12px;
    text-align: center;
  }

  .laudo-custo-card-value {
    font-size: 20px;
    font-weight: 800;
    color: var(--lau-primary);
    line-height: 1;
    margin-bottom: 4px;
  }

  .laudo-custo-card-label {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--lau-text-secondary);
    font-weight: 600;
    letter-spacing: .4px;
  }

  /* ── REVISÃO ── */
  .laudo-revisao-card {
    border: 1px solid var(--lau-border);
    border-radius: var(--lau-radius);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .laudo-revisao-card-header {
    background: #e8eef6;
    padding: 8px 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    cursor: pointer;
  }

  .laudo-revisao-km {
    font-weight: 700;
    color: var(--lau-primary);
    font-size: 14px;
  }

  .laudo-revisao-meta {
    font-size: 12px;
    color: var(--lau-text-secondary);
  }

  .laudo-revisao-preco {
    margin-left: auto;
    font-weight: 700;
    color: var(--lau-success);
    font-size: 14px;
  }

  .laudo-revisao-body {
    padding: 10px 12px;
    display: none;
  }

  .laudo-revisao-body.open { display: block; }

  /* ── CESTA BÁSICA ── */
  .laudo-cesta-search {
    width: 100%;
    max-width: 300px;
    padding: 6px 10px;
    border: 1px solid var(--lau-border);
    border-radius: var(--lau-radius);
    font-size: 13px;
    margin-bottom: 10px;
    box-sizing: border-box;
    outline: none;
    color: var(--lau-text);
  }

  .laudo-cesta-search:focus { border-color: var(--lau-accent); }

  /* ── ACESSÓRIOS ── */
  .laudo-acess-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 4px 10px;
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .laudo-acess-list li {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 3px 0;
    color: var(--lau-text);
  }

  .laudo-acess-list li::before {
    content: '✓';
    font-weight: 700;
    color: var(--lau-success);
    flex-shrink: 0;
  }

  .laudo-acess-group-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--lau-text-secondary);
    letter-spacing: .5px;
    margin: 10px 0 4px;
    border-bottom: 1px solid var(--lau-border);
    padding-bottom: 3px;
  }

  /* ── COMPARATIVO ── */
  .laudo-comp-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .laudo-comp-card {
    flex: 1;
    min-width: 190px;
    max-width: 280px;
    border: 1px solid var(--lau-border);
    border-radius: var(--lau-radius);
    overflow: hidden;
    background: #fff;
  }

  .laudo-comp-card-header {
    background: #e8eef6;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .laudo-comp-card-logo {
    width: 32px;
    height: 22px;
    object-fit: contain;
    border-radius: 2px;
  }

  .laudo-comp-card-posicao {
    margin-left: auto;
    background: var(--lau-primary);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .laudo-comp-card-body {
    padding: 8px 12px;
  }

  .laudo-comp-card-modelo {
    font-size: 12px;
    font-weight: 700;
    color: var(--lau-primary);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .laudo-comp-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-bottom: 3px;
  }

  .laudo-comp-key { color: var(--lau-text-secondary); }
  .laudo-comp-val { font-weight: 600; }

  .laudo-comp-equip-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    margin: 1px 2px 1px 0;
  }

  .equip-series  { background: var(--lau-success-bg); color: var(--lau-success); }
  .equip-missing { background: var(--lau-danger-bg);  color: var(--lau-danger); }
  .equip-opt     { background: #fffde7; color: #f57f17; }

  /* ── NOTICE ── */
  .laudo-notice {
    padding: 10px 14px;
    border-radius: var(--lau-radius);
    font-size: 13px;
    margin-bottom: 8px;
  }

  .laudo-notice-ok      { background: var(--lau-success-bg); color: var(--lau-success); border-left: 4px solid var(--lau-success); }
  .laudo-notice-warn    { background: var(--lau-warning-bg); color: var(--lau-warning); border-left: 4px solid var(--lau-warning); }
  .laudo-notice-danger  { background: var(--lau-danger-bg);  color: var(--lau-danger);  border-left: 4px solid var(--lau-danger); }
  .laudo-notice-neutral { background: #eceff1; color: #455a64; border-left: 4px solid #90a4ae; }

  /* ── GRAVAME ── */
  .laudo-gravame-card {
    border: 1px solid var(--lau-border);
    border-radius: var(--lau-radius);
    padding: 10px 12px;
    margin-bottom: 10px;
    background: #fafafa;
  }

  /* ── RODAPÉ DO LAUDO ── */
  .laudo-footer {
    text-align: center;
    font-size: 11px;
    color: var(--lau-text-secondary);
    padding: 8px 0 4px;
    border-top: 1px solid var(--lau-border);
    margin-top: 10px;
  }

  /* ── VAZIO ── */
  .laudo-empty {
    text-align: center;
    color: var(--lau-text-secondary);
    padding: 40px;
    font-size: 15px;
  }

  /* ── RESPONSIVO ── */
  @media (max-width: 600px) {
    #laudo-root { padding: 8px; }
    .laudo-header-card { flex-direction: column; }
    .laudo-comp-card { min-width: 100%; max-width: 100%; }
    .laudo-infogrid { grid-template-columns: repeat(2, 1fr); }
  }
    </style>
  </th:block>
</head>

<body>

  <!-- ── Conteúdo principal (injeta dentro do <main class="dash-content"> do layout) ── -->
  <th:block layout:fragment="content">

    <!--
      Título / breadcrumb da página (opcional — remova se não quiser)
    -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div>
        <h2 style="margin:0;font-size:18px;color:#1b3a6b;font-weight:700">
          <i class="fas fa-file-alt" style="margin-right:6px"></i>Laudo Veicular
        </h2>
        <p style="margin:4px 0 0;font-size:12px;color:#546e7a"
           th:text="${placa != null ? 'Placa: ' + placa : ''}" ></p>
      </div>
      <a th:href="@{/dashboard/consultas}"
         style="font-size:12px;color:#1b3a6b;text-decoration:none">
        <i class="fas fa-arrow-left" style="margin-right:4px"></i>Voltar às consultas
      </a>
    </div>

    <!-- Container do laudo (renderizado pelo JS) -->
<div id="laudo-root">
  <div class="laudo-empty">⏳ Carregando laudo...</div>

  </th:block>

  <!-- ── Scripts específicos do laudo ── -->
  <th:block layout:fragment="scripts">

    <!--
      1) Injeção do JSON pelo Thymeleaf.
         No seu Controller faça:
           model.addAttribute("laudoJson", objectMapper.writeValueAsString(laudoObj));
    -->
    <script th:inline="javascript">
      /*<![CDATA[*/
      /*
       * Injeção segura: funciona tanto quando laudoJson é uma String Java
       * (salvo como texto no MySQL) quanto quando é um objeto/Map Java.
       *
       * - String Java  → Thymeleaf gera uma string JS entre aspas → JSON.parse converte
       * - Object Java  → Thymeleaf gera um objeto JS literal → typeof !== 'string', usa direto
       * - null/ausente → cai no fallback {}
       */
      (function() {
        var _raw = /*[[${laudoJson}]]*/ null;
        if (_raw === null || _raw === undefined) {
          window.laudoData = {};
        } else if (typeof _raw === 'string') {
          try { window.laudoData = JSON.parse(_raw); }
          catch (e) { window.laudoData = {}; console.error('Erro ao parsear laudoJson:', e); }
        } else {
          window.laudoData = _raw;
        }
      })();
      /*]]>*/
    </script>

    <!--
      2) Toda a lógica de renderização do laudo.
    -->
    <script>
// ================================================================
// LAUDO VEICULAR — Renderização Dinâmica
// Thymeleaf: declare  var laudoData = DADOS_JSON;  antes deste script
// Exemplo (no template .html):
//   <script th:inline="javascript">

//   <\/script>

// ────────────────────────────────────────────────
// UTILITÁRIOS
// ────────────────────────────────────────────────

function fmt(val) {
  if (val === null || val === undefined || val === '') return '—';
  return String(val).trim() || '—';
}

function fmtNum(val, decimais) {
  if (val === null || val === undefined || val === '') return '—';
  var n = parseFloat(String(val).replace(',', '.'));
  if (isNaN(n)) return String(val);
  return n.toLocaleString('pt-BR', { minimumFractionDigits: decimais || 0, maximumFractionDigits: decimais || 0 });
}

function fmtBRL(val) {
  if (val === null || val === undefined || val === '') return '—';
  var n;
  if (typeof val === 'number') {
    n = val;
  } else {
    var s = String(val).trim();
    if (s.indexOf(',') !== -1) {
      // Formato brasileiro: "71.105,90" ou "71105,90"
      // Remove pontos (separadores de milhar) e troca vírgula por ponto decimal
      s = s.replace(/\./g, '').replace(',', '.');
      n = parseFloat(s);
    } else {
      // Formato numérico/americano: "49931.00" ou "49931"
      // Ponto já é separador decimal — parse direto
      n = parseFloat(s);
    }
  }
  if (isNaN(n)) return String(val);
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function isNadaConsta(text) {
  if (!text) return true;
  var t = text.toLowerCase().trim();
  return t.includes('nada consta') || t.includes('nao existe') || t.includes('não existe')
      || t.includes('sem ocorrencia') || t.includes('sem ocorrência') || t.includes('não consta')
      || t === '—' || t === '-' || t === '0' || t === '0,00' || t === 'false';
}

function statusBadge(text, override) {
  if (override) return '<span class="lau-status lau-' + override + '">' + escHtml(text) + '</span>';
  if (!text || text === '—') return '<span class="lau-status lau-neutral">—</span>';
  return isNadaConsta(text)
    ? '<span class="lau-status lau-ok">' + escHtml(text) + '</span>'
    : '<span class="lau-status lau-danger">' + escHtml(text) + '</span>';
}

function statusBool(val, okText, badText) {
  return val
    ? '<span class="lau-status lau-danger">' + escHtml(badText || 'Sim') + '</span>'
    : '<span class="lau-status lau-ok">' + escHtml(okText || 'Não') + '</span>';
}

function riskClass(idx) {
  var n = parseInt(idx) || 0;
  if (n <= 3) return 'risco-1';
  if (n <= 5) return 'risco-4';
  if (n <= 7) return 'risco-6';
  return 'risco-8';
}

function riskTextClass(idx) {
  var n = parseInt(idx) || 0;
  if (n <= 3) return 'risco-text-baixo';
  if (n <= 5) return 'risco-text-medio';
  if (n <= 7) return 'risco-text-alto';
  return 'risco-text-critico';
}

function riskLabel(idx) {
  var n = parseInt(idx) || 0;
  if (n <= 3) return 'Baixo';
  if (n <= 5) return 'Médio';
  if (n <= 7) return 'Alto';
  return 'Crítico';
}

function kvItem(label, value) {
  return '<div class="laudo-kv-item"><span class="laudo-kv-label">' + escHtml(label) + '</span>'
       + '<span class="laudo-kv-value">' + (value || '—') + '</span></div>';
}

function sectionHtml(icon, title, bodyHtml, collapsed) {
  var colClass = collapsed ? ' collapsed' : '';
  var hidClass = collapsed ? ' hidden' : '';
  return '<div class="laudo-section">'
       + '<div class="laudo-section-header' + colClass + '" onclick="laudoToggle(this)">'
       + escHtml(icon) + ' ' + escHtml(title)
       + '<span class="lau-toggle">▾</span></div>'
       + '<div class="laudo-section-body' + hidClass + '">' + bodyHtml + '</div>'
       + '</div>';
}

function detectType(data) {
  if (data.fichaTecnica) return 'Premium';
  if (data.recall)       return 'Completa';
  return 'Essencial';
}

function setLogo(marca) {
  var img = document.getElementById('laudo-logo-img');
  var fallback = document.getElementById('laudo-logo-fallback');
  if (!img || !marca) return;

  var key = String(marca).toLowerCase().trim();
  var url = LOGO_MAP[key];

  // Tentativa de correspondência parcial quando não há chave exata
  // (ex: "FORD/GM" encontra "ford"; "CAOA CHERY TIGGO" encontra "caoa chery")
  if (!url) {
    var keys = Object.keys(LOGO_MAP);
    for (var i = 0; i < keys.length; i++) {
      if (key.indexOf(keys[i]) !== -1 || keys[i].indexOf(key) !== -1) {
        url = LOGO_MAP[keys[i]];
        break;
      }
    }
  }

  if (!url) return; // marca não mapeada → mantém placeholder de texto

  img.onload = function() {
    img.classList.add('loaded');
    if (fallback) fallback.style.display = 'none';
  };
  img.onerror = function() {
    img.style.display = 'none';
    if (fallback) fallback.style.display = '';
  };
  img.src = url;
}

function laudoToggle(header) {
  header.classList.toggle('collapsed');
  var body = header.nextElementSibling;
  body.classList.toggle('hidden');
}

function renderAnaliseRisco(ar) {
  if (!ar) return '';
  var idx = parseFloat(ar.indiceRisco) || 0;
  var parecer = ar.parecer || '';
  var label = riskLabel(idx);
  var body = '<div class="laudo-risco-wrapper">';

  // Prioridade: imagem gerada pela API (imageLink), senão gauge calculado
  if (ar.imageLink) {
    body += '<div style="text-align:center;margin-bottom:12px">'
          + '<img src="' + escHtml(ar.imageLink) + '" alt="Indicador de Risco"'
          + ' style="max-width:100%;max-height:180px;border-radius:8px;object-fit:contain">'
          + '</div>';
  } else {
    // Gauge calculado a partir de indiceRisco (escala 1–10)
    body += '<div class="laudo-risco-gauge">'
          + '<div class="laudo-risco-circle ' + riskClass(idx) + '">' + idx + '</div>'
          + '<div class="laudo-risco-label ' + riskTextClass(idx) + '">' + label + '</div>'
          + '</div>';
    // Barra visual de 10 segmentos
    var barHtml = '<div class="laudo-risco-bar">';
    for (var i = 1; i <= 10; i++) {
      var seg = '';
      if (i <= 3)       seg = 'seg-baixo';
      else if (i <= 5)  seg = 'seg-medio';
      else if (i <= 7)  seg = 'seg-alto';
      else              seg = 'seg-critico';
      var active = (i <= Math.round(idx)) ? ' active' : '';
      barHtml += '<div class="laudo-risco-seg ' + seg + active + '" title="' + i + '"></div>';
    }
    barHtml += '</div>';
    body += barHtml;
  }

  body += '<div class="laudo-risco-parecer">' + escHtml(parecer) + '</div>'
        + '</div>';
  return sectionHtml('🛡️', 'Análise de Risco', body, false);
}

        + '</div>';

  return sectionHtml('⚠️', 'Situação do Veículo', body, false);
}

// SEÇÃO 7: LEILÃO
// ────────────────────────────────────────────────

function renderLeilao(leilao) {
  if (!leilao) return '';
  var score = leilao.score || {};
  var registros = leilao.registros || [];
  var hasLeilao = registros.length > 0;

  var body = '';

  // Descrição / alerta
  if (leilao.descricao) {
    var descOk = leilao.descricao.toLowerCase().includes('não consta') || leilao.descricao.toLowerCase().includes('nao consta');
    body += '<div class="laudo-notice ' + (descOk ? 'laudo-notice-ok' : 'laudo-notice-warn') + '" style="margin-bottom:12px">'
          + escHtml(leilao.descricao) + '</div>';
  }

  // Score bars
  if (score && Object.keys(score).length) {
    body += '<div class="laudo-score-bars">';
    if (score.aceitacao !== undefined) {
      body += scoreBar('Aceitação (%)', score.aceitacao);
    }
    if (score.exigenciaVistoriaEspecial !== undefined) {
      body += scoreBar('Vistoria Especial (%)', score.exigenciaVistoriaEspecial);
    }
    if (score.percentualSobreRef !== undefined) {
      body += scoreBar('% Sobre Referência', score.percentualSobreRef);
    }
    body += '</div>';
  }

  // Registros
  if (hasLeilao) {
    body += '<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--lau-primary);margin:12px 0 8px">Ocorrências em Leilão</h4>';
    body += '<table class="laudo-table"><thead><tr><th>Comitente</th><th>Data</th><th>Marca/Modelo</th><th>Placa</th><th>Cor</th><th>Cond. Geral</th></tr></thead><tbody>';
    registros.forEach(function(r) {
      body += '<tr>'
            + '<td>' + escHtml(fmt(r.comitente)) + '</td>'
            + '<td>' + escHtml(fmt(r.dataLeilao)) + '</td>'
            + '<td>' + escHtml(fmt(r.marca || r.modelo)) + '</td>'
            + '<td>' + escHtml(fmt(r.placa)) + '</td>'
            + '<td>' + escHtml(fmt(r.cor)) + '</td>'
            + '<td>' + escHtml(fmt(r.condicaoGeral)) + '</td>'
            + '</tr>';
      if (r.observacao) {
        body += '<tr><td colspan="6" style="font-size:11px;color:var(--lau-text-secondary);font-style:italic">Obs: ' + escHtml(r.observacao) + '</td></tr>';
      }
    });
    body += '</tbody></table>';
  }

  return sectionHtml('🔨', 'Leilão', body, !hasLeilao);
}

function scoreBar(label, val) {
  var pct = Math.min(100, Math.max(0, parseFloat(val) || 0));
  return '<div class="laudo-score-item">'
       + '<div class="laudo-score-item-label">' + escHtml(label) + '</div>'
       + '<div class="laudo-score-bar-wrap"><div class="laudo-score-bar-fill" style="width:' + pct + '%"></div></div>'
       + '<div class="laudo-score-value">' + fmt(val) + '%</div>'
       + '</div>';
}

function renderRecall(recall) {
  if (!recall) return '';
  var detalhes = recall.detalhes || [];
  var pendentes = recall.recallsPendente || [];

  var body = '';

  if (!detalhes.length && !pendentes.length) {
    body = '<div class="laudo-notice laudo-notice-ok">Nenhum recall encontrado para este veículo.</div>';
  } else {
    if (pendentes.length) {
      body += '<div class="laudo-notice laudo-notice-warn" style="margin-bottom:8px"><strong>Recalls Pendentes: ' + pendentes.length + '</strong></div>';
      body += '<table class="laudo-table"><thead><tr><th>Recall Pendente</th></tr></thead><tbody>'
            + pendentes.map(function(r) { return '<tr><td>' + escHtml(JSON.stringify(r)) + '</td></tr>'; }).join('')
            + '</tbody></table>';
    }
    if (detalhes.length) {
      body += '<table class="laudo-table" style="margin-top:10px"><thead><tr><th>Detalhe do Recall</th></tr></thead><tbody>'
            + detalhes.map(function(r) { return '<tr><td>' + escHtml(JSON.stringify(r)) + '</td></tr>'; }).join('')
            + '</tbody></table>';
    }
  }

  return sectionHtml('🔔', 'Recall', body, pendentes.length === 0);
}

           + '<tbody>'
           + regs.map(function(r) {
               var genuina = r.genuina ? '<span class="lau-status lau-ok">Sim</span>' : '<span class="lau-status lau-neutral">Não</span>';
               return '<tr>'
                    + '<td><strong>' + escHtml(fmt(r.apelidoDescricao)) + '</strong></td>'
                    + '<td style="font-size:12px;color:var(--lau-text-secondary)">' + escHtml(fmt(r.complemento)) + '</td>'
                    + '<td style="font-size:11px">' + escHtml(fmt(r.numeroPeca)) + '</td>'
                    + '<td style="font-size:12px">' + escHtml(fmt(r.aposDescricaoFabricante)) + '</td>'
                    + '<td style="text-align:center">' + genuina + '</td>'
                    + '<td style="text-align:right;font-weight:600">' + fmtBRL(r.valor) + '</td>'
                    + '</tr>';
             }).join('')
           + '</tbody></table>';

  return sectionHtml('🛒', 'Cesta Básica de Peças (' + regs.length + ' itens)', body, true);
}

function laudoCestaSearch(input) {
  var filter = input.value.toLowerCase();
  var tbl = document.getElementById('laudo-cesta-tbl');
  if (!tbl) return;
  var rows = tbl.getElementsByTagName('tr');
  for (var i = 1; i < rows.length; i++) {
    var text = rows[i].textContent.toLowerCase();
    rows[i].style.display = text.includes(filter) ? '' : 'none';
  }
}

// ────────────────────────────────────────────────
// SEÇÃO 19: ACESSÓRIOS
// ────────────────────────────────────────────────

function renderAcessorios(ac) {
  if (!ac) return '';
  var vf = ac.veiculosFipe || [];
  var regs = vf.length ? (vf[0].registros || []) : [];

  if (!regs.length) return '';

  // Deduplicar por descricao
  var seen = {};
  var serie = [], opcional = [];
  regs.forEach(function(r) {
    var d = (r.descricao || '').trim();
    if (!d || seen[d]) return;
    seen[d] = true;
    if (r.itemDeSerie) serie.push(d);
    else opcional.push(d);
  });

  var body = '';
  if (serie.length) {
    body += '<div class="laudo-acess-group-label">Itens de Série (' + serie.length + ')</div>'
          + '<ul class="laudo-acess-list">'
          + serie.map(function(d) { return '<li>' + escHtml(d) + '</li>'; }).join('')
          + '</ul>';
  }
  if (opcional.length) {
    body += '<div class="laudo-acess-group-label">Opcionais / Outros (' + opcional.length + ')</div>'
          + '<ul class="laudo-acess-list">'
          + opcional.map(function(d) { return '<li>' + escHtml(d) + '</li>'; }).join('')
          + '</ul>';
  }

  return sectionHtml('⭐', 'Acessórios', body, true);
}

// ────────────────────────────────────────────────
// SEÇÃO 20: COMPARATIVO DE ESPECIFICAÇÕES
// ────────────────────────────────────────────────

function renderComparativo(comp) {
  if (!comp) return '';
  var veiculos = comp.veiculoComparativo || [];
  if (!veiculos.length) return '';

  // Ordenar por posicaoGeral
  veiculos = veiculos.slice().sort(function(a, b) {
    return (parseInt(a.posicaoGeral) || 99) - (parseInt(b.posicaoGeral) || 99);
  });

  var body = '<p style="font-size:12px;color:var(--lau-text-secondary);margin:0 0 12px">Comparativo entre veículos similares da mesma categoria. Posição 1 = melhor desempenho geral.</p>'
           + '<div class="laudo-comp-cards">';

  veiculos.forEach(function(v) {
    var precoObj = v.preco || {};
    var planoObj = v.planoDeRevisao || {};
    var descObj  = v.descricao || {};
    var especs   = v.espesificacoes || [];
    var equips   = v.equipamentos || [];
    var partes   = v.partes || [];
    var pos = v.posicaoGeral || '—';

    body += '<div class="laudo-comp-card">'
          + '<div class="laudo-comp-card-header">'
          + (v.marcaImagem ? '<img class="laudo-comp-card-logo" src="' + escHtml(v.marcaImagem) + '" alt="' + escHtml(v.marca) + '" onerror="this.style.display=\'none\'" />' : '')
          + '<div style="flex:1;min-width:0">'
          + '<div style="font-size:12px;font-weight:700;color:var(--lau-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escHtml(v.marca || '') + '</div>'
          + '<div style="font-size:10px;color:var(--lau-text-secondary)">' + escHtml(fmt(v.ano)) + '</div>'
          + '</div>'
          + '<div class="laudo-comp-card-posicao">' + pos + '</div>'
          + '</div>'
          + '<div class="laudo-comp-card-body">'
          + '<div class="laudo-comp-card-modelo">' + escHtml(v.modelo || '') + '</div>';

    // Dados básicos
    if (precoObj.preco)                    body += compRow('Preço', fmtBRL(precoObj.preco));
    if (planoObj.primeiraRevisaoPreco)     body += compRow('1ª Revisão', fmtBRL(planoObj.primeiraRevisaoPreco));

    especs.slice(0, 4).forEach(function(e) {
      body += compRow(e.descricao, e.valor);
    });

    // Equipamentos (resumido)
    if (equips.length) {
      body += '<div style="margin-top:6px;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--lau-text-secondary);margin-bottom:3px">Equipamentos</div>'
            + '<div>';
      equips.slice(0, 6).forEach(function(eq) {
        var cls = eq.status === 'Series' ? 'equip-series' : (eq.status === 'Missing' ? 'equip-missing' : 'equip-opt');
        body += '<span class="laudo-comp-equip-tag ' + cls + '">' + escHtml(eq.descricao) + '</span>';
      });
      if (equips.length > 6) body += '<span class="laudo-comp-equip-tag equip-opt">+' + (equips.length - 6) + ' mais</span>';
      body += '</div>';
    }

    body += '</div></div>';
  });

  body += '</div>';
  return sectionHtml('📐', 'Comparativo de Especificações', body, true);
}

function compRow(key, val) {
  return '<div class="laudo-comp-row"><span class="laudo-comp-key">' + escHtml(key) + '</span><span class="laudo-comp-val">' + escHtml(String(val || '—')) + '</span></div>';
}

// ────────────────────────────────────────────────
// RENDERIZADOR PRINCIPAL
// ────────────────────────────────────────────────

function renderLaudo(data) {
  var type = detectType(data);
  var root = document.getElementById('laudo-root');
  if (!root) return;

  var html = '';

  // Cabeçalho
  html += renderHeader(data, type);

  // Análise de Risco
  html += renderAnaliseRisco(data.analiseRisco);

  // Dados do Veículo
  html += renderDadosVeiculo(data);

  // Situação (Roubo/Furto + Sinistro + BN)
  html += renderSituacaoVeiculo(data);

  // Débitos
  html += renderDebitos(data.baseEstadual);

  // Restrições
  html += renderRestricoes(data);

  // Leilão
  html += renderLeilao(data.leilao);

  // Seções exclusivas de Completa e Premium
  if (type === 'Completa' || type === 'Premium') {
    html += renderRecall(data.recall);
    html += renderGravame(data.gravame);
    html += renderLocadora(data.registroEmLocadora);
  }

  // Histórico de Proprietários
  html += renderHistoricoProprietarios(data.historicoProprietarios);

  // FIPE
  html += renderFipe(data.dadosBasicosDoVeiculo);

  // Seções exclusivas Premium
  if (type === 'Premium') {
    html += renderFichaTecnica(data.fichaTecnica);
    html += renderDiagnostico(data.diagnosticoDoVeiculo);
    html += renderRadarSecuritario(data.radarSecuritario);
  }

  // Custo Médio (Essencial + Completa)
  if (type === 'Essencial' || type === 'Completa') {
    html += renderCustoMedio(data.custoMedio);
  }

  // Plano de Revisão (todos)
  html += renderRevisao(data.revisao);

  // Cesta Básica (todos — colapsada por padrão)
  html += renderCestaBasica(data.cestaBasica);

  // Acessórios (todos — colapsada por padrão)
  html += renderAcessorios(data.acessorios);

  // Comparativo
  html += renderComparativo(data.comparativoEspecificacoes);

  // Rodapé
  html += '<div class="laudo-footer">Laudo Veicular &mdash; Consulta ' + escHtml(type)
        + (data.dtUltimaAtualizacao ? ' &mdash; ' + escHtml(data.dtUltimaAtualizacao) : '')
        + '</div>';

  root.innerHTML = html;

  // Injeta logo da montadora após inserir o HTML no DOM
  var marca = (data.dadosBasicosDoVeiculo && data.dadosBasicosDoVeiculo.marca)
              || data.marcaModelo || '';
  setLogo(marca);
}

// ────────────────────────────────────────────────
// INICIALIZAÇÃO
// ────────────────────────────────────────────────

(function init() {
  function doRender() {
    /* laudoData deve ser declarado pelo Thymeleaf antes deste script.
       Em ambiente de desenvolvimento, defina window.laudoData = { ... } antes. */
    var data = window.laudoData;
    // Suporte extra: se por algum motivo ainda chegou como string, parseia aqui também
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch(e) { data = {}; }
    }
    if (data && typeof data === 'object' && Object.keys(data).length > 0) {
      renderLaudo(data);
    } else {
      var root = document.getElementById('laudo-root');
      if (root) root.innerHTML = '<div class="laudo-empty">⚠️ Nenhum dado de laudo disponível.<br><small>Verifique se o Controller está passando <code>laudoJson</code> para o Model.</small></div>';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', doRender);
  } else {
    doRender();
  }
})();
    </script>

  </th:block>

</body>
