<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{dashboard/layout_dash}">

<head>
<title>Meus Dados</title>
<link rel="stylesheet" th:href="@{/dashboard/css/profile.css}" />
</head>

<body>
	<main layout:fragment="content">

		<div class="dash-page-title">
			Meus <span>Dados</span>
		</div>

		<div class="dash-card profile-card">
			<div class="profile-section-title">Atualizar Cadastro</div>

			<form th:action="@{/dashboard/profile}" method="post"
				class="profile-form">
				<input type="hidden" th:name="${_csrf.parameterName}"
					th:value="${_csrf.token}" />

				<!-- Nome -->
				<div class="form-group">
					<label>Nome Completo</label>
					<div class="input-wrapper">
						<i class="fas fa-user icon-left"></i> <input type="text"
							name="fullName" th:value="${user.name}"
							placeholder="Ex: João Silva" required />
					</div>
				</div>

				<!-- CPF (somente leitura) -->
				<div class="form-group">
					<label>CPF</label>
					<div class="input-wrapper">
						<i class="fas fa-id-card icon-left"></i> <input type="text"
							th:value="${user.federalId}" disabled />
					</div>
				</div>

				<!-- Email -->
				<div class="form-group">
					<label>E-mail</label>
					<div class="input-wrapper">
						<i class="fas fa-envelope icon-left"></i> <input type="email"
							name="email" th:value="${user.email}" placeholder="seu@email.com"
							required />
					</div>
				</div>

				<!-- Telefone -->
				<div class="form-group">
					<label>Telefone</label>
					<div class="input-wrapper">
						<i class="fas fa-phone icon-left"></i> <input type="text"
							name="phone" th:value="${user.phone}"
							placeholder="(00) 00000-0000" maxlength="15"
							oninput="mascaraTelefone(this)" />
					</div>
				</div>

				<hr class="profile-divider" />

				<div class="profile-section-title">
					Alterar Senha <span>(deixe em branco para manter a atual)</span>
				</div>

				<!-- Nova Senha -->
				<div class="form-group">
					<label>Nova Senha</label>
					<div class="input-wrapper">
						<i class="fas fa-lock icon-left"></i> <input type="password"
							name="password" id="newPassword"
							placeholder="Crie uma nova senha"
							oninput="verificarForcaCadastro(this.value)" /> <i
							class="fas fa-eye toggle-password"
							onclick="toggleSenha('newPassword', this)"></i>
					</div>
					<div class="strength-bar">
						<div class="strength-fill" id="strengthFillCad"></div>
					</div>
					<div class="strength-label" id="strengthLabelCad"></div>
					<div class="password-hint">Mínimo 8 caracteres, com letras e
						números.</div>
				</div>

				<!-- Confirmar Senha -->
				<div class="form-group">
					<label>Confirmar Nova Senha</label>
					<div class="input-wrapper">
						<i class="fas fa-lock icon-left"></i> <input type="password"
							name="confirmPassword" id="confirmPassword"
							placeholder="Repita a nova senha" /> <i
							class="fas fa-eye toggle-password"
							onclick="toggleSenha('confirmPassword', this)"></i>
					</div>
				</div>

				<button type="submit" class="btn-save">
					<i class="fas fa-save"></i> Salvar Alterações
				</button>
			</form>
		</div>

	</main>

	<th:block layout:fragment="scripts">
		<script th:inline="javascript">
			const sucesso = /*[[${sucesso}]]*/null;
			const erro = /*[[${erro}]]*/null;

			if (sucesso) {
				Swal.fire({
					icon : 'success',
					title : 'Dados atualizados!',
					text : sucesso,
					confirmButtonColor : '#3085d6'
				});
			}

			if (erro) {
				Swal.fire({
					icon : 'error',
					title : 'Erro ao atualizar',
					text : erro,
					confirmButtonColor : '#3085d6'
				});
			}

			document
					.querySelector('form')
					.addEventListener(
							'submit',
							function(e) {
								const nova = document
										.getElementById('newPassword').value;
								const confirma = document
										.getElementById('confirmPassword').value;

								if (nova && nova !== confirma) {
									e.preventDefault();
									Swal.fire({
										icon : 'error',
										title : 'Senhas diferentes',
										text : 'As senhas não coincidem.',
										confirmButtonColor : '#3085d6'
									});
								}
							});
		</script>
	</th:block>
</body>
</html>
